<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1·2주차 오브젝트 잡기</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="js/systems/grab-settings.js"></script>
    <script src="js/components/grab-highlight.js"></script>
    <script src="js/components/mouse-grabbable.js"></script>
    <script src="js/components/vr-grabber.js"></script>
    <script src="js/components/hand-grabber.js"></script>
    <script src="js/components/hand-collapse-guard.js"></script>
    <script src="js/components/rig-movement.js"></script>
    <!-- Pull/Push 배율 테스트 화면 (거리 눈금, 물체 라벨, 손목 게이지, 모드 패널) -->
    <script src="js/utils/gain-test-utils.js"></script>
    <script src="js/components/gain-floor-marks.js"></script>
    <script src="js/components/gain-object-label.js"></script>
    <script src="js/components/gain-wrist-gauge.js"></script>
    <script src="js/components/gain-panel.js"></script>
    <style>
      /* VR에 들어가기 전 화면에서 실습 목록으로 돌아가는 링크 */
      .back-link {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(26, 29, 58, 0.85);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", sans-serif;
        font-size: 16px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <a class="back-link" href="../">← 실습 목록</a>
    <a-scene cursor__mouse="rayOrigin: mouse" raycaster="objects: .grabbable, .hand-button">
      <!-- rig를 움직이면 카메라, 컨트롤러, 손이 함께 이동한다. -->
      <a-entity id="rig" position="0 0 0" rig-movement>
        <a-entity camera look-controls position="0 1.6 0"></a-entity>

        <a-entity
          id="rightHand"
          laser-controls="hand: right"
          vr-grabber
          raycaster="objects: .grabbable; far: 10; enabled: false"
        ></a-entity>
        <a-entity
          id="leftHand"
          laser-controls="hand: left"
          vr-grabber
          raycaster="objects: .grabbable; far: 10; enabled: false"
        ></a-entity>

        <a-entity
          id="rightHandTracking"
          hand-tracking-controls="hand: right"
          hand-collapse-guard
          hand-grabber
          raycaster="objects: .grabbable, .hand-button; far: 10; showLine: true"
          cursor="rayOrigin: entity; fuse: false"
        ></a-entity>
        <a-entity
          id="leftHandTracking"
          hand-tracking-controls="hand: left"
          hand-collapse-guard
          hand-grabber
          gain-wrist-gauge
          raycaster="objects: .grabbable, .hand-button; far: 10; showLine: true"
          cursor="rayOrigin: entity; fuse: false"
        ></a-entity>

        <!-- 발 기준 거리 눈금 (rig와 함께 움직임) -->
        <a-entity gain-floor-marks></a-entity>
      </a-entity>

      <!-- 배율 테스트: 물체 위 거리·배율 라벨, 왼쪽 앞 모드 패널 -->
      <a-entity gain-object-label></a-entity>
      <a-entity gain-panel position="-1.9 1.25 -1.3" rotation="0 55 0"></a-entity>

      <a-sky color="#ECECEC"></a-sky>

      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="#7BC8A4"
      ></a-plane>

      <a-box
        id="box1"
        grab-highlight
        mouse-grabbable
        class="grabbable"
        position="-1 0.5 -2"
        color="#4CC3D9"
        width="1"
        height="1"
        depth="1"
      ></a-box>
      <a-cylinder
        id="cylinder1"
        grab-highlight
        mouse-grabbable
        class="grabbable"
        position="0.5 0.5 -2.5"
        color="#FFC65D"
        radius="0.4"
        height="1"
      ></a-cylinder>
    </a-scene>
  </body>
</html>
