<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VR 실습 1주차</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("mouse-grabbable", {
        init: function () {
          var el = this.el;
          var originalColor = el.getAttribute("material").color;
          var grabbed = false;

          el.addEventListener("mouseenter", function () {
            if (!grabbed)
              el.setAttribute("material", "color", "rgb(215, 123, 31)");
          });

          el.addEventListener("mouseleave", function () {
            if (!grabbed) el.setAttribute("material", "color", originalColor);
          });

          el.addEventListener("mousedown", function () {
            grabbed = true;
            console.log("grab", el.id);
            el.setAttribute("material", "color", "#EF2D5E");
          });

          window.addEventListener("mouseup", function () {
            if (!grabbed) return;
            grabbed = false;
            console.log("release", el.id);
            el.setAttribute("material", "color", originalColor);
          });
        },
      });
    </script>
  </head>
  <body>
    <a-scene cursor__mouse="rayOrigin: mouse" raycaster="objects: .grabbable">
      <a-entity id="rig" position="0 0 0">
        <a-entity
          camera
          look-controls
          wasd-controls
          position="0 1.6 0"
        ></a-entity>
      </a-entity>

      <a-entity
        id="rightHand"
        laser-controls="hand: right"
        raycaster="objects: .grabbable; far: 10"
      ></a-entity>
      <a-entity
        id="leftHand"
        laser-controls="hand: left"
        raycaster="objects: .grabbable; far: 10"
      ></a-entity>

      <a-sky color="#ECECEC"></a-sky>

      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="#7BC8A4"
      ></a-plane>

      <a-box
        id="box1"
        mouse-grabbable
        class="grabbable"
        position="-1 0.5 -2"
        color="#4CC3D9"
        width="1"
        height="1"
        depth="1"
      ></a-box>
      <a-cylinder
        id="cylinder1"
        mouse-grabbable
        class="grabbable"
        position="0.5 0.5 -2.5"
        color="#FFC65D"
        radius="0.4"
        height="1"
      ></a-cylinder>
    </a-scene>
  </body>
</html>
