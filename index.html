<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VR 실습 1주차</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="js/components/mouse-grabbable.js"></script>
    <script src="js/components/vr-grabber.js"></script>
    <script src="js/components/hand-grabber.js"></script>
  </head>
  <body>
    <a-scene cursor__mouse="rayOrigin: mouse" raycaster="objects: .grabbable">
      <a-entity id="rig" position="0 0 0">
        <a-entity
          camera
          look-controls
          wasd-controls
          position="0 1.6 0"
        ></a-entity>
      </a-entity>

      <a-entity
        id="rightHand"
        laser-controls="hand: right"
        vr-grabber
        raycaster="objects: .grabbable; far: 10"
      ></a-entity>
      <a-entity
        id="leftHand"
        laser-controls="hand: left"
        vr-grabber
        raycaster="objects: .grabbable; far: 10"
      ></a-entity>

      <a-entity
        id="rightHandTracking"
        hand-tracking-controls="hand: right"
        hand-grabber
        raycaster="objects: .grabbable; far: 10; showLine: true"
        cursor="rayOrigin: entity; fuse: false"
      ></a-entity>
      <a-entity
        id="leftHandTracking"
        hand-tracking-controls="hand: left"
        hand-grabber
        raycaster="objects: .grabbable; far: 10; showLine: true"
        cursor="rayOrigin: entity; fuse: false"
      ></a-entity>

      <a-sky color="#ECECEC"></a-sky>

      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="10"
        height="10"
        color="#7BC8A4"
      ></a-plane>

      <a-box
        id="box1"
        mouse-grabbable
        class="grabbable"
        position="-1 0.5 -2"
        color="#4CC3D9"
        width="1"
        height="1"
        depth="1"
      ></a-box>
      <a-cylinder
        id="cylinder1"
        mouse-grabbable
        class="grabbable"
        position="0.5 0.5 -2.5"
        color="#FFC65D"
        radius="0.4"
        height="1"
      ></a-cylinder>
    </a-scene>
  </body>
</html>
